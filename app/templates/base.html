<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title if title else "Automation Control Center" }}</title>

  <link rel="stylesheet" href="/static/style.css" />

  <style>
    /* Light, safe defaults in case style.css is minimal */
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background: #f6f7fb; }
    header { background: #0b1b2b; color: #fff; padding: 14px 18px; }
    header .brand { font-style: italic; opacity: .95; }
    main { max-width: 980px; margin: 36px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.06); padding: 28px; }
    footer { text-align: center; padding: 26px 0; color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Automation Control Center</div>
  </header>

  <main>
    <div class="card">
      {# IMPORTANT: every page (jobs, logs, etc.) must render inside this block #}
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>© Automation Control Center — learning project</footer>
</body>
</html>
